<style>

play:inline-block;padding:7px 10px;border-radius:999px;margin:4px;font-size:13px}.good{background:#063922;color:#88ffc7}.bad{background:#451721;color:#ff9aa7}.info{background:#24304f;color:#dce4ff}.vio{background:#2d2149;color:#d6c1ff}.notice{border-left:4px solid var(--yel);padding-left:10px;color:#dce4ff}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.inp{width:100%;background:#0f1528;color:#fff;border:1px solid #344064;border-radius:12px;padding:9px}.mini{font-size:12px;color:#b9c3e4}.table{width:100%;border-collapse:separate;border-spacing:0 6px}.table td,.table th{background:#0f1528;border-top:1px solid #344064;border-bottom:1px solid #344064;padding:8px;font-size:12px;text-align:left}.table th{color:#aeb8d8}.table td:first-child,.table th:first-child{border-left:1px solid #344064;border-radius:10px 0 0 10px}.table td:last-child,.table th:last-child{border-right:1px solid #344064;border-radius:0 10px 10px 0}canvas{width:100%;height:190px;background:#0f1528;border:1px solid #344064;border-radius:14px}@media(max-width:560px){.kpi,.grid3{grid-template-columns:1fr}.result{font-size:30px}h1{font-size:23px}.table td,.table th{font-size:11px;padding:6px}}

<body>
<div class="wrap">
<h1>Ayaz Trade — Model Hafızalı Teknik Analiz</h1>
<div class="small">Motor: Rejim → Model → Lokasyon → Tetik → Risk/Ödül → Model Hafızası. Çalışan model aktif, zarar eden model pasif.</div>
<div class="card">
  <button id="selectedBox" class="selectedBox" onclick="toggleList()">BTCUSDT<small>Liste kapalı - açmak için dokun</small></button>
  <div id="listPanel" class="hidden"><input id="search" class="search" placeholder="Ara: BTC, ETH, SOL, AVAX..." oninput="renderList()"><div id="chips" class="chips"></div></div>
  <div class="tf"><button data-tf="5m" onclick="setTf('5m')">5D</button><button data-tf="15m" onclick="setTf('15m')">15D</button><button data-tf="30m" onclick="setTf('30m')">30D</button><button data-tf="1h" onclick="setTf('1h')">1S</button><button data-tf="2h" onclick="setTf('2h')">2S</button><button data-tf="4h" onclick="setTf('4h')" class="active">4S</button><button data-tf="1d" onclick="setTf('1d')">1G</button></div>
  <div class="row"><button class="btn" onclick="loadMarketData(true)">Veriyi Yenile</button><span class="mini" id="dataStatus">Veri bekleniyor...</span><span class="mini" id="wsStatus">WS: bekliyor</span></div>
</div>
<div class="card">
  <h2>Backtest / Model Ayarları</h2>
  <div class="grid3">
    <label class="mini">Başlangıç kasa ($)<input class="inp" id="btCash" type="number" value="100" min="10" step="10" oninput="analyzeSelected()"></label>
    <label class="mini">Min kalite<input class="inp" id="minQuality" type="number" value="74" min="40" max="95" oninput="analyzeSelected()"></label>
    <label class="mini">Min R/R<input class="inp" id="minRR" type="number" value="1.25" min="0.5" step="0.05" oninput="analyzeSelected()"></label>
    <label class="mini">Max stop %<input class="inp" id="maxStopPct" type="number" value="2.2" min="0.3" step="0.1" oninput="analyzeSelected()"></label>
    <label class="mini">Risk %<input class="inp" id="riskPct" type="number" value="1" min="0.1" step="0.1" oninput="analyzeSelected()"></label>
    <label class="mini">Cooldown mum<input class="inp" id="cooldown" type="number" value="8" min="0" step="1" oninput="analyzeSelected()"></label>
    <label class="mini">Model min PF<input class="inp" id="modelMinPF" type="number" value="1.05" min="0.5" step="0.05" oninput="analyzeSelected()"></label>
    <label class="mini">Model min işlem<input class="inp" id="modelMinTrades" type="number" value="5" min="1" step="1" oninput="analyzeSelected()"></label>
  </div>
</div>
<div id="out" class="card"><p>Veri yükleniyor...</p></div>
<div class="card"><canvas id="chart" width="760" height="240"></canvas></div>
<div id="diag" class="card"><p>Model teşhis raporu burada görünecek.</p></div>
</div>
<script>
let selected='BTCUSDT',tf='4h',listOpen=false,marketData=null,ws=null,wsLive=false,livePatch=null;
let symbols=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','DOTUSDT','TRXUSDT','MATICUSDT','LTCUSDT','BCHUSDT','ATOMUSDT'];
const tfLabels={'5m':'5 dakika','15m':'15 dakika','30m':'30 dakika','1h':'1 saat','2h':'2 saat','4h':'4 saat','1d':'1 gün'};
const wsTf={'5m':'5m','15m':'15m','30m':'30m','1h':'1h','2h':'2h','4h':'4h','1d':'1d'};
function el(id){return document.getElementById(id)}function show(x){el('out').innerHTML=x}function last(a){return a[a.length-1]}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}function std(a){let m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)*(x-m))))||0}function pct(a,b){return b?((a-b)/b)*100:0}function fmt(v,d=4){return Number(v).toLocaleString('tr-TR',{maximumFractionDigits:d})}function val(id){return parseFloat(el(id)?.value||0)}
function ema(a,n){let k=2/(n+1),r=[],e=a[0];for(let v of a){e=v*k+e*(1-k);r.push(e)}return r}function sma(a,n){return a.map((_,i)=>avg(a.slice(Math.max(0,i-n+1),i+1)))}function rsi(a,n=14){if(a.length<n+2)return 50;let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];d>0?g+=d:l-=d}if(l===0)return 100;let rs=g/l;return 100-100/(1+rs)}function macd(a){let e12=ema(a,12),e26=ema(a,26),m=e12.map((v,i)=>v-e26[i]),s=ema(m,9);return{line:last(m),signal:last(s),hist:last(m)-last(s)}}function atr(h,l,c,n=14){let tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));return avg(tr.slice(-n))||0}function stoch(c,h,l,n=14){let hi=Math.max(...h.slice(-n)),lo=Math.min(...l.slice(-n)),d=hi-lo;return d?((last(c)-lo)/d)*100:50}function roc(c,n=10){return c.length>n?((last(c)-c[c.length-1-n])/c[c.length-1-n])*100:0}function highest(a,n){return Math.max(...a.slice(-n))}function lowest(a,n){return Math.min(...a.slice(-n))}function boll(c,n=20,m=2){let s=c.slice(-n),mid=avg(s),sd=std(s);return{mid,up:mid+m*sd,lo:mid-m*sd,width:mid?((m*sd*2)/mid)*100:0}}function obv(c,v){let o=[0];for(let i=1;i<c.length;i++){let p=o[i-1];o.push(c[i]>c[i-1]?p+v[i]:c[i]<c[i-1]?p-v[i]:p)}return o}function vwapValue(h,l,c,v,n=80){let pv=0,vv=0;for(let i=Math.max(0,c.length-n);i<c.length;i++){let t=(h[i]+l[i]+c[i])/3;pv+=t*v[i];vv+=v[i]}return vv?pv/vv:last(c)}function cci(h,l,c,n=20){let tp=c.map((_,i)=>(h[i]+l[i]+c[i])/3),r=tp.slice(-n),ma=avg(r),md=avg(r.map(x=>Math.abs(x-ma)));return md?(last(tp)-ma)/(0.015*md):0}function mfi(h,l,c,v,n=14){let pos=0,neg=0;if(c.length<n+2)return 50;for(let i=c.length-n;i<c.length;i++){let tp=(h[i]+l[i]+c[i])/3,pr=(h[i-1]+l[i-1]+c[i-1])/3,flow=tp*v[i];if(tp>pr)pos+=flow;else if(tp<pr)neg+=flow}if(neg===0)return 100;return 100-(100/(1+pos/neg))}function adxValue(h,l,c,n=14){let pd=[],md=[],tr=[];for(let i=1;i<c.length;i++){let up=h[i]-h[i-1],dn=l[i-1]-l[i];pd.push(up>dn&&up>0?up:0);md.push(dn>up&&dn>0?dn:0);tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])))}let t=avg(tr.slice(-n));if(!t)return 0;let p=100*(avg(pd.slice(-n))/t),m=100*(avg(md.slice(-n))/t),dx=Math.abs(p-m)/(p+m)*100;return isFinite(dx)?dx:0}
function rowsToBars(rows){return rows.map(x=>({time:x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4],volume:+x[5]})).filter(x=>x.close>0)}
function barsArrays(b){return{O:b.map(x=>x.open),H:b.map(x=>x.high),L:b.map(x=>x.low),C:b.map(x=>x.close),V:b.map(x=>x.volume)}}
function updateSelectedBox(){el('selectedBox').innerHTML=`${selected}<small>${listOpen?'Liste açık - seçim yapınca kapanır':'Liste kapalı - açmak için dokun'}</small>`}function toggleList(){listOpen=!listOpen;renderList()}function renderList(){updateSelectedBox();el('listPanel').classList.toggle('hidden',!listOpen);if(!listOpen){el('chips').innerHTML='';return}let q=el('search').value.toUpperCase().trim();let arr=symbols.filter(s=>!q||s.includes(q)||s.replace('USDT','').includes(q));el('chips').innerHTML=arr.map(s=>`<button class="chip ${s===selected?'active':''}" onclick="pick('${s}')">${s}</button>`).join('')}function pick(s){selected=s;listOpen=false;renderList();startWs();analyzeSelected()}function setTf(x){tf=x;document.querySelectorAll('.tf button').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));startWs();analyzeSelected()}
async function loadMarketData(force=false){try{el('dataStatus').textContent='data/market.json okunuyor...';let r=await fetch('data/market.json?ts='+(force?Date.now():Math.floor(Date.now()/60000)),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);marketData=await r.json();if(!marketData.ok){show(`<div class="result warn">VERİ BEKLENİYOR</div><p>${marketData.message||'market.json henüz üretilmedi.'}</p>`);return}symbols=marketData.symbols||symbols;if(!symbols.includes(selected))selected=symbols[0]||'BTCUSDT';let t=new Date(marketData.generatedAt).toLocaleString('tr-TR');el('dataStatus').textContent='Son JSON: '+t;renderList();startWs();analyzeSelected()}catch(e){show(`<div class="result warn">VERİ DOSYASI HATASI</div><p>data/market.json okunamadı: ${e.message}</p>`);el('dataStatus').textContent='Veri dosyası okunamadı'}}
function startWs(){try{if(ws)ws.close();wsLive=false;livePatch=null;let stream=(selected.toLowerCase()+'@kline_'+(wsTf[tf]||'4h'));el('wsStatus').textContent='WS: bağlanıyor';ws=new WebSocket('wss://stream.binance.com:9443/ws/'+stream);ws.onopen=()=>{el('wsStatus').textContent='WS: bağlı'};ws.onmessage=e=>{try{let j=JSON.parse(e.data),k=j.k;if(!k)return;livePatch={time:+k.t,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v,closed:!!k.x,receivedAt:Date.now()};wsLive=true;el('wsStatus').textContent='WS: CANLI '+new Date().toLocaleTimeString('tr-TR');analyzeSelected(true)}catch(_){}};ws.onerror=()=>{wsLive=false;el('wsStatus').textContent='WS: çalışmadı'};ws.onclose=()=>{if(!wsLive)el('wsStatus').textContent='WS: koptu/engel'};}catch(e){el('wsStatus').textContent='WS: engel '+e.message}}
function getSelectedData(){if(!marketData||!marketData.ok)throw Error('Veri hazır değil');let row=marketData.markets&&marketData.markets[selected]&&marketData.markets[selected][tf];if(!row)throw Error(`${selected}/${tf} verisi yok`);if(!row.ok){let err=new Error(row.error||'Bu sembol/zaman dilimi başarısız');err.attempts=row.attempts||[];throw err}if(!row.candles||row.candles.length<120)throw Error('Mum sayısı yetersiz');let candles=row.candles.map(x=>x.slice());if(livePatch){let lastC=last(candles);if(lastC&&livePatch.time>=lastC[0]){if(livePatch.time===lastC[0])candles[candles.length-1]=[livePatch.time,livePatch.open,livePatch.high,livePatch.low,livePatch.close,livePatch.volume];else candles.push([livePatch.time,livePatch.open,livePatch.high,livePatch.low,livePatch.close,livePatch.volume]);}}return {...row,candles,live:!!livePatch}}
function freshness(){if(!marketData||!marketData.generatedAt)return{age:999,status:'YOK',cls:'bad',factor:0};let age=Math.round((Date.now()-new Date(marketData.generatedAt).getTime())/60000);if(wsLive&&livePatch)return{age:0,status:'CANLI WS',cls:'good',factor:1};if(age<=7)return{age,status:'TAZE',cls:'good',factor:1};if(age<=15)return{age,status:'DİKKAT',cls:'warn',factor:.9};return{age,status:'KİLİTLİ/BAYAT',cls:'bad',factor:.45}}
function findRecentFVG(b,i,type,look=45){
  for(let k=i-1;k>=Math.max(2,i-look);k--){
    if(type==='bull' && b[k].low>b[k-2].high){
      return {type:'bull',born:k,age:i-k,low:b[k-2].high,high:b[k].low,mid:(b[k-2].high+b[k].low)/2};
    }
    if(type==='bear' && b[k].high<b[k-2].low){
      return {type:'bear',born:k,age:i-k,low:b[k].high,high:b[k-2].low,mid:(b[k].high+b[k-2].low)/2};
    }
  }
  return null;
}
function ctxAt(b,i){
  let sl=b.slice(0,i+1),{O,H,L,C,V}=barsArrays(sl),price=last(C),at=atr(H,L,C),e9=last(ema(C,9)),e21=last(ema(C,21)),e55=last(ema(C,55)),e100=last(ema(C,100)),e200=last(ema(C,Math.min(200,C.length))),rs=rsi(C),mc=macd(C),sto=stoch(C,H,L),rc=roc(C),bb=boll(C),adx=adxValue(H,L,C),cciVal=cci(H,L,C),mfiVal=mfi(H,L,C,V),obvArr=obv(C,V),obvSlope=last(obvArr)-obvArr[Math.max(0,obvArr.length-10)],vwap=vwapValue(H,L,C,V,80);
  let srLen=Math.min(60,C.length-5),sup=lowest(L.slice(0,-1),srLen),res=highest(H.slice(0,-1),srLen),swingLo=lowest(L.slice(-20),20),swingHi=highest(H.slice(-20),20);
  let body=Math.abs(last(C)-last(O)),range=Math.max(last(H)-last(L),1e-9),upper=last(H)-Math.max(last(O),last(C)),lower=Math.min(last(O),last(C))-last(L);
  let nearSup=(price-sup)/Math.max(at,1e-9),nearRes=(res-price)/Math.max(at,1e-9),emaDist=Math.abs(price-e21)/Math.max(at,1e-9);
  let trendUp=e21>e55&&price>e100,trendDn=e21<e55&&price<e100,rangeReg=!trendUp&&!trendDn,volOk=(last(V)||0)>(avg(V.slice(-20))||1)*1.05;
  let bosUp=price>res, bosDn=price<sup, chochUp=bosUp&&!trendUp, chochDn=bosDn&&!trendDn;
  let sweepL=last(L)<sup&&price>sup, sweepS=last(H)>res&&price<res;
  let bullCandle=price>last(O)&&body/range>.45,bearCandle=price<last(O)&&body/range>.45;
  let bullFVG=findRecentFVG(b,i,'bull'),bearFVG=findRecentFVG(b,i,'bear');
  let bullFvgRetest=!!(bullFVG && last(L)<=bullFVG.high && price>=bullFVG.low && price>=bullFVG.mid);
  let bearFvgRetest=!!(bearFVG && last(H)>=bearFVG.low && price<=bearFVG.high && price<=bearFVG.mid);
  let bullFvgHeld=!!(bullFVG && last(L)>=bullFVG.low-at*.25 && price>bullFVG.mid);
  let bearFvgHeld=!!(bearFVG && last(H)<=bearFVG.high+at*.25 && price<bearFVG.mid);
  let fvgLongDNA=trendUp&&bullFvgRetest&&bullFvgHeld&&bullCandle&&rs>50&&mc.hist>=0&&price>vwap&&nearRes>1.05&&bullFVG.age<=38;
  let fvgShortDNA=trendDn&&bearFvgRetest&&bearFvgHeld&&bearCandle&&rs<50&&mc.hist<=0&&price<vwap&&nearSup>1.05&&bearFVG.age<=38;
  let pullLong=trendUp&&price>e21&&last(L)<=e21+at*.45&&bullCandle&&rs>50&&mc.hist>-at*.02&&nearRes>1;
  let pullShort=trendDn&&price<e21&&last(H)>=e21-at*.45&&bearCandle&&rs<50&&mc.hist<at*.02&&nearSup>1;
  let breakoutL=bosUp&&trendUp&&rs>52&&mc.hist>0&&volOk&&nearRes<0;
  let breakoutS=bosDn&&trendDn&&rs<48&&mc.hist<0&&volOk&&nearSup<0;
  let sweepLong=sweepL&&lower>body*1.2&&bullCandle&&rs>44&&nearRes>1;
  let sweepShort=sweepS&&upper>body*1.2&&bearCandle&&rs<56&&nearSup>1;
  let supportLong=nearSup<1.05&&bullCandle&&rs>45&&mc.hist>-at*.03&&nearRes>1.25;
  let resistanceShort=nearRes<1.05&&bearCandle&&rs<55&&mc.hist<at*.03&&nearSup>1.25;
  let trendStartLong=chochUp&&price>e21&&bullCandle&&rs>50&&nearRes>1;
  let trendStartShort=chochDn&&price<e21&&bearCandle&&rs<50&&nearSup>1;
  return{price,at,e9,e21,e55,e100,e200,rs,mc,sto,rc,bb,adx,cciVal,mfiVal,obvSlope,vwap,sup,res,swingLo,swingHi,body,range,upper,lower,nearSup,nearRes,emaDist,trendUp,trendDn,rangeReg,volOk,bosUp,bosDn,chochUp,chochDn,sweepL,sweepS,bullFVG,bearFVG,bullFvgRetest,bearFvgRetest,bullFvgHeld,bearFvgHeld,fvgLongDNA,fvgShortDNA,bullCandle,bearCandle,pullLong,pullShort,breakoutL,breakoutS,sweepLong,sweepShort,supportLong,resistanceShort,trendStartLong,trendStartShort,C,H,L,O,V}
}
function perfState(model,perf){
  let p=perf&&perf[model]; if(!p||p.n<val('modelMinTrades'))return {status:'YENİ/TEST',boost:0,reason:'model hafızası için veri az'};
  let pf=p.gl?p.gp/p.gl:(p.gp?9.99:0),wr=p.w/p.n*100,minPF=val('modelMinPF')||1.05;
  if(p.p>0&&pf>=Math.max(1.2,minPF)&&wr>=45)return {status:'AKTİF',boost:10,reason:`model geçmişi güçlü PF ${fmt(pf,2)} / Win %${fmt(wr,1)}`};
  if(p.p<0||pf<minPF||wr<38)return {status:'PASİF',boost:-35,reason:`model geçmişi zayıf PF ${fmt(pf,2)} / Win %${fmt(wr,1)}`};
  return {status:'NÖTR',boost:-4,reason:`model geçmişi sınırda PF ${fmt(pf,2)} / Win %${fmt(wr,1)}`};
}
function scoreModel(cx,side,model,perf){
  let q=50,reasons=[],veto=[];
  if(side==='LONG'){
    if(cx.trendUp){q+=12;reasons.push('ana trend yukarı')}else if(model.includes('Dönüş')||model.includes('Sweep')||model.includes('CHOCH')){q+=3;reasons.push('dönüş modeli toleransı')}else{q-=12;veto.push('LONG için ana trend zayıf')}
    if(cx.rs>52){q+=6;reasons.push('RSI pozitif')} if(cx.mc.hist>0){q+=6;reasons.push('MACD pozitif')} if(cx.price>cx.vwap){q+=5;reasons.push('VWAP üstü')} if(cx.obvSlope>0){q+=4;reasons.push('OBV pozitif')} if(cx.volOk){q+=4;reasons.push('hacim destekli')} if(cx.bullCandle){q+=6;reasons.push('güçlü tepki mumu')}
    if(cx.nearRes<.9){q-=26;veto.push('direnç dibinde LONG')} if(cx.emaDist>3.2){q-=14;veto.push('EMA’dan uzak/geç LONG')}
  }else{
    if(cx.trendDn){q+=12;reasons.push('ana trend aşağı')}else if(model.includes('Dönüş')||model.includes('Sweep')||model.includes('CHOCH')){q+=3;reasons.push('dönüş modeli toleransı')}else{q-=12;veto.push('SHORT için ana trend zayıf')}
    if(cx.rs<48){q+=6;reasons.push('RSI negatif')} if(cx.mc.hist<0){q+=6;reasons.push('MACD negatif')} if(cx.price<cx.vwap){q+=5;reasons.push('VWAP altı')} if(cx.obvSlope<0){q+=4;reasons.push('OBV negatif')} if(cx.volOk){q+=4;reasons.push('hacim destekli')} if(cx.bearCandle){q+=6;reasons.push('zayıf/reddedilen mum')}
    if(cx.nearSup<.9){q-=26;veto.push('destek dibinde SHORT')} if(cx.emaDist>3.2){q-=14;veto.push('EMA’dan uzak/geç SHORT')}
  }
  if(model==='FVG Devam LONG'){
    if(cx.fvgLongDNA){q+=18;reasons.push('Bullish FVG retest + tutunma + momentum')}else{q-=35;veto.push('FVG LONG DNA eksik: trend/retest/tutunma/momentum yok')}
  }
  if(model==='FVG Devam SHORT'){
    if(cx.fvgShortDNA){q+=18;reasons.push('Bearish FVG retest + red + momentum')}else{q-=25;veto.push('FVG SHORT DNA eksik')}
  }
  if(model.includes('Break')){q+=10;reasons.push('kırılım modeli')}
  if(model.includes('Pullback')){q+=9;reasons.push('pullback modeli')}
  if(model.includes('Sweep')){q+=9;reasons.push('likidite sweep dönüş modeli')}
  if(model.includes('Destek')||model.includes('Direnç')){q+=7;reasons.push('destek/direnç reaksiyon modeli')}
  if(model.includes('CHOCH')){q+=8;reasons.push('yapı değişimi modeli')}
  let ps=perfState(model,perf); if(perf){q+=ps.boost;reasons.push(ps.reason); if(ps.status==='PASİF')veto.push('başarısız model hafızası: işlem kapalı')}
  return{quality:Math.max(0,Math.min(98,Math.round(q))),reasons,veto,perfStatus:ps.status}
}
function chooseSignal(b,i,opts={}){
  let cx=ctxAt(b,i),cands=[];
  if(cx.fvgLongDNA)cands.push(['LONG','FVG Devam LONG']);
  if(cx.fvgShortDNA)cands.push(['SHORT','FVG Devam SHORT']);
  if(cx.breakoutL)cands.push(['LONG','Breakout LONG']);
  if(cx.breakoutS)cands.push(['SHORT','Breakdown SHORT']);
  if(cx.pullLong)cands.push(['LONG','Pullback LONG']);
  if(cx.pullShort)cands.push(['SHORT','Pullback SHORT']);
  if(cx.sweepLong)cands.push(['LONG','Sweep Dönüş LONG']);
  if(cx.sweepShort)cands.push(['SHORT','Sweep Dönüş SHORT']);
  if(cx.supportLong)cands.push(['LONG','Destek Tepki LONG']);
  if(cx.resistanceShort)cands.push(['SHORT','Direnç Reddi SHORT']);
  if(cx.trendStartLong)cands.push(['LONG','CHOCH Dönüş LONG']);
  if(cx.trendStartShort)cands.push(['SHORT','CHOCH Dönüş SHORT']);
  let best=null;
  for(let [side,model] of cands){
    let s=scoreModel(cx,side,model,opts.ignorePerf?null:opts.perf),riskPlan=planTrade(cx,side,model),stopPct=Math.abs(cx.price-riskPlan.stop)/cx.price*100,rr=riskPlan.rr;
    s.quality+=rr>1.8?5:rr>1.35?2:-10;
    if(stopPct>val('maxStopPct')){s.quality-=18;s.veto.push('stop mesafesi yüksek')}
    if(rr<val('minRR')){s.quality-=20;s.veto.push('RR zayıf')}
    let obj={side,model,quality:s.quality,reasons:s.reasons,veto:s.veto,perfStatus:s.perfStatus,cx,...riskPlan,stopPct};
    if(!best||obj.quality>best.quality)best=obj;
  }
  if(!best)return{side:'PAS',model:'Model yok',quality:0,cx,reasons:[],veto:['Net teknik model oluşmadı']};
  let minQ=opts.minQuality||val('minQuality')||74;
  let hard=best.veto.some(v=>v.includes('dibinde')||v.includes('hafızası')||v.includes('DNA eksik'));
  if(best.quality<minQ||hard||best.stopPct>val('maxStopPct')||best.rr<val('minRR'))return{...best,side:'PAS',passSide:best.side,passReason:(best.quality<minQ?'kalite düşük; ':'')+best.veto.join('; ')};
  return best
}
function planTrade(cx,side,model){
  let e=cx.price,at=cx.at,stop,tp1,tp2,tp3,targetZone;
  if(side==='LONG'){
    let structuralStop=model==='FVG Devam LONG'&&cx.bullFVG?cx.bullFVG.low-at*.18:Math.min(cx.sup-at*.12,cx.swingLo-at*.08);
    stop=Math.min(structuralStop,e-at*.85); let risk=e-stop;
    let structural=Math.max(cx.res,e+risk*1.65); tp1=e+risk*.7; tp2=e+risk*1.25; tp3=Math.max(structural,e+risk*1.9); targetZone=structural;
  }else{
    let structuralStop=model==='FVG Devam SHORT'&&cx.bearFVG?cx.bearFVG.high+at*.18:Math.max(cx.res+at*.12,cx.swingHi+at*.08);
    stop=Math.max(structuralStop,e+at*.85); let risk=stop-e;
    let structural=Math.min(cx.sup,e-risk*1.65); tp1=e-risk*.7; tp2=e-risk*1.25; tp3=Math.min(structural,e-risk*1.9); targetZone=structural;
  }
  let risk=Math.abs(e-stop),reward=Math.abs(tp3-e);return{entry:e,stop,tp1,tp2,tp3,rr:reward/Math.max(risk,1e-9),targetZone}
}
function analyzeSelected(skipDraw=false){try{let d=getSelectedData();let b=rowsToBars(d.candles),fr=freshness();let bt=runBacktest(b);let sig=chooseSignal(b,b.length-1,{minQuality:val('minQuality'),perf:bt.perf});let liveQ=Math.round((sig.quality||0)*fr.factor);let locked=fr.factor<.7;drawChart(b,sig.entry||last(b).close,sig.stop,sig.tp2);let cls=sig.side==='LONG'?'long':sig.side==='SHORT'?'short':locked?'warn':'pass';let headline=locked?'SİNYAL KİLİTLİ':sig.side==='PAS'?'İŞLEM YOK':sig.side;let noRisk=sig.side==='PAS';let fmtOr=(v)=>noRisk?'Hesaplanmadı':fmt(v);show(`<div class="result ${cls}">${headline}</div><div class="kpi"><div>Sembol<b>${selected}</b></div><div>TF<b>${tf}</b></div><div>Model<b>${sig.model}</b></div><div>Model Durumu<b>${sig.perfStatus||'TEST'}</b></div><div>Ham Kalite<b>%${sig.quality||0}</b></div><div>Canlı Kalite<b>%${liveQ}</b></div><div>Veri Durumu<b>${fr.status}</b></div><div>Veri Yaşı<b>${fr.age} dk</b></div><div>Kaynak<b>${d.source||'market.json'}</b></div><div>Fiyat<b>${fmt(sig.cx.price)}</b></div><div>Giriş<b>${noRisk?'Hesaplanmadı':fmt(sig.entry)}</b></div><div>Stop<b>${fmtOr(sig.stop)}</b></div><div>R/R<b>${noRisk?'Hesaplanmadı':fmt(sig.rr,2)}</b></div><div>Hedef 1<b>${fmtOr(sig.tp1)}</b></div><div>Hedef 2<b>${fmtOr(sig.tp2)}</b></div><div>Hedef 3<b>${fmtOr(sig.tp3)}</b></div><div>ATR<b>${fmt(sig.cx.at)}</b></div></div><p><b>Model gerekçeleri:</b><br>${(sig.reasons||[]).map(x=>`<span class="badge good">${x}</span>`).join('')||'<span class="badge info">Yok</span>'}</p><p><b>Veto / Pas nedenleri:</b><br>${(sig.veto||[]).concat(sig.passReason?[sig.passReason]:[]).map(x=>`<span class="badge bad">${x}</span>`).join('')||'<span class="badge good">Veto yok</span>'}</p><p class="notice">Bu sürümde FVG SHORT’un çalışan DNA’sı çıkarıldı; FVG LONG ancak bullish FVG retest + tutunma + yukarı trend + momentum varsa aktifleşir. Başarısız model hafızası canlı işlemi veto eder.</p>${bt.html}`);el('diag').innerHTML=bt.diag;}catch(e){let attempts=e.attempts||[];show(`<div class="result warn">VERİ HATASI</div><p>${e.message}</p>${attempts.map(a=>`<span class="badge ${a.ok?'good':'bad'}">${a.source}: ${a.ok?'ÇALIŞTI':'ÇALIŞMADI '+(a.error||'')}</span>`).join('')}`)}}
function simulateTrade(b,start,sig){let entry=sig.entry,stop=sig.stop,tp1=sig.tp1,tp2=sig.tp2,tp3=sig.tp3,side=sig.side,risk=Math.abs(entry-stop),qty=1,real=0,be=false,hit1=false,hit2=false,mfe=0,mae=0,exit='ZAMAN',exitPx=last(b.slice(start,start+1)).close,hold=0;let maxHold=Math.min(36,b.length-start-1);for(let j=start+1;j<=start+maxHold;j++){let x=b[j],fav=side==='LONG'?x.high-entry:entry-x.low,adv=side==='LONG'?entry-x.low:x.high-entry;mfe=Math.max(mfe,fav/risk);mae=Math.max(mae,adv/risk);let stopHit=side==='LONG'?x.low<=stop:x.high>=stop;let tp1Hit=side==='LONG'?x.high>=tp1:x.low<=tp1;let tp2Hit=side==='LONG'?x.high>=tp2:x.low<=tp2;let tp3Hit=side==='LONG'?x.high>=tp3:x.low<=tp3;if(stopHit){exit=be?'BE/STOP':'STOP';exitPx=stop;hold=j-start;break}if(!hit1&&tp1Hit){real+=.35*(Math.abs(tp1-entry)/risk);qty-=.35;hit1=true;stop=entry+(side==='LONG'?risk*.04:-risk*.04);be=true}if(!hit2&&tp2Hit){real+=.35*(Math.abs(tp2-entry)/risk);qty-=.35;hit2=true;stop=entry+(side==='LONG'?risk*.45:-risk*.45)}if(tp3Hit){real+=qty*(Math.abs(tp3-entry)/risk);qty=0;exit='TP3';exitPx=tp3;hold=j-start;break}if(j-start>=3&&!hit1&&mfe<.35&&mae>.55){exit='MİKRO KORUMA';exitPx=x.close;hold=j-start;break}if(j-start>=7&&!hit1){exit='ZAMAN';exitPx=x.close;hold=j-start;break}}
if(qty>0){let pnlR=side==='LONG'?(exitPx-entry)/risk:(entry-exitPx)/risk;real+=qty*pnlR}let totalR=real;let reason=exit;if(totalR<0){if(mae>1.1)reason+=' / aleyhe hızlı hareket';else if(mfe<.35)reason+=' / takip gelmedi';else reason+=' / çıkış yetersiz'}return{r:totalR,mfe,mae,exit,reason,hold}}
function runBacktest(b){let cash=val('btCash')||100,riskPct=val('riskPct')||1,cool=val('cooldown')||8,trades=[],skips=0,coolLeft=0;for(let i=220;i<b.length-40;i++){if(coolLeft>0){coolLeft--;continue}let sig=chooseSignal(b,i,{minQuality:val('minQuality'),ignorePerf:true});if(sig.side==='PAS'){skips++;continue}let sim=simulateTrade(b,i,sig);let riskAmt=cash*(riskPct/100);let pnl=riskAmt*sim.r;cash+=pnl;trades.push({...sim,pnl,cash,side:sig.side,model:sig.model,quality:sig.quality,rr:sig.rr,stopPct:sig.stopPct,time:b[i].time});coolLeft=cool}let wins=trades.filter(t=>t.pnl>0),loss=trades.filter(t=>t.pnl<0),gp=wins.reduce((a,t)=>a+t.pnl,0),gl=Math.abs(loss.reduce((a,t)=>a+t.pnl,0)),pf=gl?gp/gl:(gp?9.99:0),wr=trades.length?wins.length/trades.length*100:0,net=cash-(val('btCash')||100);let peak=val('btCash')||100,dd=0;for(let t of trades){peak=Math.max(peak,t.cash);dd=Math.max(dd,(peak-t.cash)/peak*100)}let by={};for(let t of trades){let k=t.model;by[k]??={n:0,w:0,p:0,gp:0,gl:0,mfe:[],mae:[]};by[k].n++;if(t.pnl>0)by[k].w++;by[k].p+=t.pnl;t.pnl>0?by[k].gp+=t.pnl:by[k].gl+=Math.abs(t.pnl);by[k].mfe.push(t.mfe);by[k].mae.push(t.mae)}let perf=by;let rows=Object.entries(by).sort((a,b)=>b[1].p-a[1].p).map(([k,v])=>{let mp=perfState(k,by),pfm=v.gl?v.gp/v.gl:(v.gp?9.99:0),mfe=avg(v.mfe),mae=avg(v.mae);return `<tr><td>${k}</td><td>${mp.status}</td><td>${v.n}</td><td>%${fmt(v.w/v.n*100,1)}</td><td>${fmt(v.p,2)}$</td><td>${fmt(pfm,2)}</td><td>${fmt(mfe,2)}/${fmt(mae,2)}</td></tr>`}).join('');let bads={};for(let t of loss){bads[t.reason]=(bads[t.reason]||0)+1}let badHtml=Object.entries(bads).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="badge bad">${k}: ${v}</span>`).join('')||'<span class="badge good">Zarar yok</span>';let lastRows=trades.slice(-8).reverse().map(t=>`<tr><td>${new Date(t.time).toLocaleDateString('tr-TR')}</td><td>${t.side}</td><td>${t.model}</td><td>${t.exit}</td><td>${fmt(t.pnl,2)}$</td><td>MFE ${fmt(t.mfe,2)}R / MAE ${fmt(t.mae,2)}R</td></tr>`).join('');let active=Object.entries(by).filter(([k,v])=>perfState(k,by).status==='AKTİF').map(([k])=>`<span class="badge good">${k}</span>`).join('')||'<span class="badge info">Henüz aktif model yok</span>';let passive=Object.entries(by).filter(([k,v])=>perfState(k,by).status==='PASİF').map(([k])=>`<span class="badge bad">${k}</span>`).join('')||'<span class="badge good">Pasif model yok</span>';let html=`<h2>Model Hafızalı Backtest</h2><div class="kpi"><div>Son kasa<b>${fmt(cash,2)}$</b></div><div>Net sonuç<b>${fmt(net,2)}$ / %${fmt(net/(val('btCash')||100)*100,2)}</b></div><div>İşlem<b>${trades.length}</b></div><div>Pas geçilen<b>${skips}</b></div><div>Kazanma<b>%${fmt(wr,1)}</b></div><div>Profit Factor<b>${fmt(pf,2)}</b></div><div>Max düşüş<b>%${fmt(dd,1)}</b></div><div>Ort. MFE/MAE<b>${fmt(avg(trades.map(t=>t.mfe)),2)}R / ${fmt(avg(trades.map(t=>t.mae)),2)}R</b></div></div><p><b>Aktif modeller:</b><br>${active}</p><p><b>Pasif/veto modeller:</b><br>${passive}</p>`;let diag=`<h2>Teknik Teşhis Paneli</h2><p><b>Model performansı ve hafıza durumu:</b></p><table class="table"><tr><th>Model</th><th>Durum</th><th>İşlem</th><th>Win</th><th>Net</th><th>PF</th><th>MFE/MAE</th></tr>${rows||'<tr><td colspan="7">İşlem yok</td></tr>'}</table><p><b>Kaybetme sebepleri:</b><br>${badHtml}</p><p><b>Son işlemler:</b></p><table class="table"><tr><th>Tarih</th><th>Yön</th><th>Model</th><th>Çıkış</th><th>PnL</th><th>MFE/MAE</th></tr>${lastRows||'<tr><td colspan="6">İşlem yok</td></tr>'}</table><p class="notice">Bu sürümde her model ayrı ölçülür. FVG Devam LONG, SHORT'un ters simetrisiyle yeniden yazıldı: bullish FVG retest + tutunma + momentum şartı olmadan LONG açılmaz. Model geçmişi zayıfsa canlı sinyal veto edilir.</p>`;return{html,diag,trades,perf}}
function drawChart(b,entry,stop,tp){let canvas=el('chart'),ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0f1528';ctx.fillRect(0,0,w,h);let arr=b.slice(-90).map(x=>x.close),min=Math.min(...arr,entry||last(arr),stop||last(arr),tp||last(arr)),max=Math.max(...arr,entry||last(arr),stop||last(arr),tp||last(arr)),pad=(max-min)*.08||1;min-=pad;max+=pad;let y=v=>h-20-(v-min)/(max-min)*(h-40),x=i=>20+i/(arr.length-1)*(w-40);ctx.strokeStyle='#7aa2ff';ctx.lineWidth=2;ctx.beginPath();arr.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.stroke();function line(v,color,name){if(!v)return;ctx.strokeStyle=color;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(20,y(v));ctx.lineTo(w-20,y(v));ctx.stroke();ctx.fillStyle=color;ctx.font='13px Arial';ctx.fillText(name+' '+fmt(v),24,y(v)-4)}line(entry,'#ffd166','Giriş');line(stop,'#ff6b7a','Stop');line(tp,'#2cff9a','Hedef')}
